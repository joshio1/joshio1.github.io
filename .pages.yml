# Pages CMS configuration › https://pagescms.org/docs/configuration/

media:
  input: assets/images
  output: /assets/images
  rename: safe
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [.placeholder]
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss
      - name: categories
        label: Categories
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text

  - name: drafts
    label: Drafts
    type: collection
    path: _drafts
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: categories
        label: Categories
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text
