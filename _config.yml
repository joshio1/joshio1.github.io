# Setup
title: Omkar's Musings
tagline: Ruby on Rails, Software Engineering and Life
description: 'Omkar''s Musings on Ruby on Rails, Software Engineering and Life'
url: https://joshio1.github.io
baseurl: ''
paginate: 10
permalink: /posts/:title/

# About/contact
author:
  name: Omkar Joshi
  url: https://github.com/joshio1
  email: omkar@example.com

# Gems
plugins:
  - jekyll-paginate
  - jekyll-gist
  - jekyll-feed
  - jekyll-sitemap

# Custom vars
version: 1.1.0
google_analytics_id: #UA-XXXX-Y

# Enhanced syntax highlighting configuration
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Sass configuration
sass:
  style: compressed

# Exclude files
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - lanyon-master
  - lanyon-master.zip
  - backup
